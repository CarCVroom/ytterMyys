<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="src/style/style.css">
	<title>ytterMyys</title>
</head>
<body>
	<header id="header">
	<h1 id="header_text">ytterMyys</h1>
	</header>
	<h1>ytterMyys is an orbital sandbox and a spacecraft simulator</h1>
	<h2>Under you will add in stats like periapsis and apoapsis and any potential orbital changes</h2>

	<!-- User inputs here-->
	<label for="apoapsis">Apoapsis (meters): </label><br>
	<input type="number" name="apoapsis" id="apoapsis" placeholder="Enter your apoapsis here">

	<br>

	<label for="periapsis">Periapsis (meters): </label><br>
	<input type="number" name="periapsis" id="periapsis" placeholder="Enter your apoapsis here">

	<br>

	<button  name="start" id="start" >Start</button>

	<!-- User changes to the orbit here-->

	<h2>Change orbit</h1>
	<label>
		<input type="radio" name="orbit_change" value="change_to" checked>
		Change to a different periapsis and apoapsis
	</label>

	<label>
		<input type="radio" name="orbit_change" value="deltaV" checked>
		Burn at a spot in orbit with a certian amount of deltaV for n amount of seconds
	</label>

	<h2>Orbit simulator</h1>

	<script type="importmap"> {
	"imports": {
		"three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
	}
    	}
    	</script>
	<script  type="module" src="src/ts/main.js"></script>

	<h4 id="altitude_gauge"> Altitude: </h4>
	<h4 id="time_gauge"> Time elapsed: </h4>

	<div style="display: flex; justify-content: center; align-items: center;">
	<div id="orbit_area"></div>
	</div>
</body>
</html>
